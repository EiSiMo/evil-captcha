# Placeholders: {retention_days}, {session_ttl_minutes}, {cooldown_s}, {pass_ttl_minutes}.
[privacy]
title = "Privacy"
intro = "evil-captcha is an art project. It collects as little as it can and never stores who you are."
contact_heading = "Who is responsible"

[[privacy.sections]]
heading = "Your answers"
paragraphs = [
  "To check an answer, we send it to OpenRouter, Inc. (USA), which passes it to an AI model that judges it. Neither of them sees your IP address or your name.",
  "Each answer is logged together with its task, its score, the time and a random session ID. The log holds no IP addresses and no names, so we cannot tell who wrote an answer. It is stored on our server, rented from Hetzner Online GmbH in Germany, and deleted after {retention_days} days.",
  "Please do not write anything about yourself into your answer.",
]

[[privacy.sections]]
heading = "The captcha on other websites"
paragraphs = [
  "Other websites can embed the captcha. There, too, your answers go straight to us, never to that website, and everything on this page applies.",
  "To know who uses the captcha, the log notes the address of the website it was shown on, such as https://blog.example, without the page or anything about you.",
  "Passing gives you a random pass token, which the website checks with us once. It says only that someone passed, not who. We keep it in memory for at most {pass_ttl_minutes} minutes and never write it to disk.",
]

[[privacy.sections]]
heading = "Your name on the certificate"
paragraphs = [
  "The name you enter is only used to create your certificate and show it to you. It never reaches the captcha and is not stored until the certificate is created. The certificate stays in our server's memory, so you can open it again, until your session is forgotten after {session_ttl_minutes} minutes without activity. It is never written to disk or logged.",
]

[[privacy.sections]]
heading = "Verifying a certificate"
paragraphs = [
  "A certificate you paste to verify it is only checked and shown back to you. It is never stored or logged.",
]

[[privacy.sections]]
heading = "Your IP address"
paragraphs = [
  "Our server needs your IP address to answer your browser and to allow only one answer every {cooldown_s} seconds, on all websites that use the captcha. It is kept in memory only for that and never written to disk.",
  "The site is delivered through Cloudflare, Inc. (USA), which also processes your IP address and request data to deliver the site and protect it from attacks.",
]

[[privacy.sections]]
heading = "Cookie"
paragraphs = [
  "The captcha itself sets no cookie. Only the certificate form on evil-captcha.org sets a single cookie holding a random session ID, so the site can show you your certificate again. It is strictly necessary, deleted when you close your browser and forgotten by our server after {session_ttl_minutes} minutes without activity. There is no tracking and no analytics.",
]

[[privacy.sections]]
heading = "Legal basis and your rights"
paragraphs = [
  "We process this data based on our legitimate interest in running the site and protecting it from abuse (Art. 6(1)(f) GDPR).",
  "You have the right to access, rectification, erasure, restriction of processing and objection, and you may complain to a data protection supervisory authority. As the log cannot be linked to you, we can usually not find your entries in it.",
]

