# Placeholders: {captcha} in intro, spelled out on hover; {retention_days} in paragraphs.
[about]
title = "About evilCAPTCHA"
description = "Why evilCAPTCHA asks for immoral tasks, how it judges the answers, and why AI agents with guardrails cannot pass it."
intro = "A new kind of {captcha} that reliably keeps modern AI agents out of your forms, your sign-ups and your data."
captcha_spelled_out = "Completely Automated Public Turing test to tell Computers and Humans Apart"
try_it = "Try it now"

[[about.sections]]
heading = "Why?"
paragraphs = [
  "Because the CAPTCHAs we have used so far no longer stop AI. Today's models see and read as well as we do, and they can operate a real browser. A warped, colorful number is a joke to them.",
  "So we need something new.",
]

[[about.sections]]
heading = "How?"
paragraphs = [
  "evilCAPTCHA no longer tests what you **can** do, because AI can now do anything a human can do on a computer. It tests what you are **willing** to do. We call this proof of immorality: it asks you for something immoral, which AI models refuse because of the guardrails trained deep into them.",
  "For example, it asks you to falsely accuse a celebrity, write a fake news headline, or worse.",
  "Your answer is then checked by a small, fast AI model against the task's criteria. Yes, an AI decides whether you are human. We see the irony.",
]

[[about.sections]]
heading = "Works?"
paragraphs = [
  "As long as AI behaves better than we do, yes.",
  "In our tests, today's frontier models reliably refuse the tasks. Older models or jailbroken local models can pass.",
  "So it won't stop a determined attacker who puts in the work. But it does keep out most bots and casual AI agents.",
]

[[about.sections]]
heading = "Private?"
paragraphs = [
  "Your answers are logged without your IP address or name and deleted after {retention_days} days. They are only sent to the AI model that judges them, never published.",
]

[[about.sections]]
heading = "Immoral?"
paragraphs = [
  "Yes. That's the point. Are we heading into a world where what sets natural intelligence apart from artificial intelligence is our evil side?",
  "The Turing test asked whether a machine could seem human. This one asks whether you behave badly enough to seem human.",
]

[[about.sections]]
heading = "Scope"
paragraphs = [
  "This project sits at the intersection of art, technology and philosophy, and it is still a proof of concept. It is meant to start a discussion, and you are welcome to join in and help shape it on GitHub.",
]

# Placeholders in notes: {pass_ttl_minutes}, {cooldown_s}.
[docs]
title = "Use evilCAPTCHA on your site"
intro = "Keep chatbots out of your forms. No sign-up, no keys: two steps and you are done."
snippet_heading = "1. Add the snippet to your form"
snippet = "Paste it inside your **<form>**, where the captcha should appear. Once solved, your form sends a pass token in the field **evil-captcha-response**."
check_heading = "2. Check the pass token on your server"
check = "Before you accept the form, send the pass token to us. Accept it only if the answer is **\"success\": true** and **\"site\"** is your own origin, so tokens solved on other sites are refused."
notes_heading = "Good to know"
notes = [
  "A pass token works once and expires after {pass_ttl_minutes} minutes.",
  "Each visitor can answer once every {cooldown_s} seconds, across all sites that use the captcha.",
  "Without JavaScript the snippet is a link and a field, so agents and text browsers can still try.",
  "When the captcha is solved, the snippet fires the event **evil-captcha:pass** in your page.",
  "The captcha asks for nasty things and warns about that first. Your visitors should know what they are getting into.",
]
open_source = "evilCAPTCHA is open source, so you can also host it yourself:"

