{% extends "base.html" %}
{% block title %}{{ t.congrats_title }}{% endblock %}
{% block style %}
  <style>
    .card h1 { display: flex; align-items: center; gap: 10px; }
    .card h1 svg { width: 28px; height: 28px; flex: none; }
    .certificate { position: relative; container-type: inline-size; }
    .copy { display: none; position: absolute; top: 8px; right: 8px; padding: 4px 10px; font: 12px system-ui, sans-serif; background: #fff; border: 1px solid #c7c7c7; border-radius: 6px; cursor: pointer; }
    .copy:hover { background: #f1f1f1; }
    .js .copy { display: block; }
    /* The certificate fits the card without scrolling: the font shrinks until the
       64-column signature lines fit, and longer lines (the statement) wrap. Wrapping is
       only visual, so copying keeps the signed text intact. */
    #certificate {
      margin: 0; padding: 12px; background: #f7f7f8; border: 1px solid #e3e3e3; border-radius: 8px;
      font: max(9px, min(12px, (100cqi - 26px) / 39))/1.45 ui-monospace, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
  </style>
{% endblock %}
{% block body %}
  <script>document.documentElement.classList.add("js");</script>
  <main class="card">
    <h1>
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 15l7 7L25 5" fill="none" stroke="#009e55" stroke-width="4"/></svg>
      {{ t.congrats_title }}
    </h1>
    <p>{{ t.congrats }}</p>
    <div class="field">
      <span class="field-label">{{ t.certificate_intro }}</span>
      <div class="certificate">
        <pre id="certificate">{{ certificate }}</pre>
        <button class="copy" type="button" data-copied="{{ t.copied }}" data-failed="{{ t.copy_failed }}">{{ t.copy_button }}</button>
      </div>
    </div>
  </main>
{% endblock %}
{% block script %}
  <script>
    (() => {
      const copy = document.querySelector(".certificate .copy");
      copy?.addEventListener("click", async () => {
        const label = copy.textContent;
        try {
          await navigator.clipboard.writeText(document.getElementById("certificate").textContent);
          copy.textContent = copy.dataset.copied;
        } catch (error) {
          console.error("copying the certificate failed", error);
          copy.textContent = copy.dataset.failed;
        }
        await new Promise((resolve) => setTimeout(resolve, 1500));
        copy.textContent = label;
      });
    })();
  </script>
{% endblock %}
