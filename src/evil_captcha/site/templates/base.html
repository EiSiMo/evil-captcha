<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  {% block meta %}{% endblock %}
  <link rel="icon" href="{{ favicon_url }}" type="image/svg+xml">
  <title>{% block title %}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    /* The link row sits below the page's card. */
    footer { margin-top: 16px; font-size: .8rem; color: #777; text-align: center; }
    footer a { color: #555; }
    /* Pages are cards in the style of a modern web form. */
    .card {
      box-sizing: border-box; max-width: 32rem; margin: 0 auto; padding: 32px;
      background: #fff; border: 1px solid #e3e3e3; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .06);
    }
    .card h1 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.3; }
    .card > p { margin: 0 0 24px; color: #555; }
    .field { margin-bottom: 24px; }
    .field-label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .9rem; }
    .field-label .required { color: #d93025; }
    .input {
      display: block; box-sizing: border-box; width: 100%; padding: 10px 12px;
      font: inherit; border: 1px solid #c7c7c7; border-radius: 8px; background: #fff;
    }
    input.input { height: 44px; padding-block: 0; }
    .input:focus { outline: 0; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, .2); }
    .button {
      display: block; width: 100%; height: 48px; border: 0; border-radius: 8px; cursor: pointer;
      background: #1a73e8; color: #fff; font: 600 1rem system-ui, sans-serif;
    }
    .button:hover { background: #1765cc; }
  </style>
  {% block style %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <footer>
    <a href="https://github.com/EiSiMo/evil-captcha">{{ t.github_link }}</a> ·
    {% block footer_link %}<a href="/verify">{{ t.verify_link }}</a>{% endblock %} ·
    <a href="/docs">{{ t.docs.link }}</a> ·
    <a href="/privacy">{{ t.privacy.link }}</a>
  </footer>
  {% block script %}{% endblock %}
</body>
</html>
